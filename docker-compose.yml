services:
  kerbecs:
    container_name: depot-kerbecs
    image: bk1031/kerbecs:latest
    restart: always
    ports:
      - "127.0.0.1:10310:10310"
    volumes:
      - ./kerbecs.yaml:/etc/kerbecs/kerbecs.yaml:ro
    environment:
      KERBECS_CONFIG: /etc/kerbecs/kerbecs.yaml
    depends_on:
      - depot
      - web

  depot:
    container_name: depot-depot
    build:
      context: ./depot
      dockerfile: Dockerfile.dev
    restart: always
    working_dir: /app
    ports:
      - "127.0.0.1:9999:9999"
    volumes:
      - ./depot:/app
      - depot_gopath:/go
    depends_on:
      - db
    environment:
      ENV: DEV
      PORT: 9999
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      DATABASE_NAME: depot
      STORAGE_BACKEND: s3
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SENTINEL_URL: ${SENTINEL_URL}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID}
      SENTINEL_CLIENT_SECRET: ${SENTINEL_CLIENT_SECRET}
      SENTINEL_REDIRECT_URI: ${SENTINEL_REDIRECT_URI}
      SENTINEL_SA_TOKEN: ${SENTINEL_SA_TOKEN}

  web:
    container_name: depot-web
    image: node:22-alpine
    restart: always
    working_dir: /app
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:10310
      VITE_SENTINEL_URL: ${SENTINEL_URL}
      VITE_SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID}

  db:
    container_name: depot-db
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: depot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  depot_gopath:
  web_node_modules:
  pgdata:
