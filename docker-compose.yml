services:
  kerbecs:
    container_name: depot-kerbecs
    image: bk1031/kerbecs:latest
    restart: always
    ports:
      - "127.0.0.1:10320:10320"
    volumes:
      - ./kerbecs.yaml:/etc/kerbecs/kerbecs.yaml:ro
    environment:
      KERBECS_CONFIG: /etc/kerbecs/kerbecs.yaml
    depends_on:
      - depot
      - web

  depot:
    container_name: depot-depot
    build:
      context: ./depot
      dockerfile: Dockerfile.dev
    restart: always
    env_file:
      - ./example.env
    working_dir: /app
    ports:
      - "127.0.0.1:9993:9993"
    volumes:
      - ./depot:/app
      - depot_gopath:/go
    depends_on:
      - db
      - minio
    environment:
      ENV: DEV
      PORT: 9993
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      DATABASE_NAME: depot
      STORAGE_BACKEND: s3
      S3_BUCKET: depot
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio123
      S3_FORCE_PATH_STYLE: "true"
      SENTINEL_REDIRECT_URI: http://localhost:10320/auth/login

  web:
    container_name: depot-web
    image: node:22-alpine
    restart: always
    working_dir: /app
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:10320
      VITE_SENTINEL_URL: https://sso.gauchoracing.com
      VITE_SENTINEL_CLIENT_ID: ${DEPOT_SENTINEL_CLIENT_ID:-}

  db:
    container_name: depot-db
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: depot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  minio:
    container_name: depot-minio
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  createbuckets:
    container_name: depot-createbuckets
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio123; do sleep 1; done;
      mc mb -p local/depot;
      exit 0;
      "

volumes:
  depot_gopath:
  web_node_modules:
  pgdata:
  miniodata:
